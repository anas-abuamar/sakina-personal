<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A63"/>
      <stop offset="1" stop-color="#0C1020"/>
    </linearGradient>

    <!-- Sky inside the porthole: night above, the warmth of a low sun below. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#151B33"/>
      <stop offset="0.55" stop-color="#33305A"/>
      <stop offset="0.82" stop-color="#C97F63"/>
      <stop offset="1.00" stop-color="#F0B27A"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.72" r="0.42">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="porthole">
      <circle cx="512" cy="512" r="268"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#case)"/>

  <g clip-path="url(#porthole)">
    <rect x="244" y="244" width="536" height="536" fill="url(#sky)"/>
    <circle cx="512" cy="600" r="200" fill="url(#halo)"/>
    <!-- The sun, resting on the horizon rather than above it: the whole app is
         about the moment the day turns over. -->
    <circle cx="512" cy="600" r="96" fill="#FFE7C2"/>
    <rect x="244" y="600" width="536" height="180" fill="#0B0E1A"/>
    <rect x="244" y="596" width="536" height="8" fill="#FFE7C2" opacity="0.92"/>
  </g>

  <!-- Timer ring, opened at the top like a countdown part-way through. -->
  <g transform="rotate(-90 512 512)">
    <circle cx="512" cy="512" r="292" fill="none"
            stroke="#EEF2FF" stroke-opacity="0.14" stroke-width="26"/>
    <circle cx="512" cy="512" r="292" fill="none"
            stroke="#EEF2FF" stroke-width="26" stroke-linecap="round"
            stroke-dasharray="1376 459"/>
  </g>
</svg>
