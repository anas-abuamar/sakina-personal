      <rect width="512" height="512" fill="#fff"/>
      <path d="M 120 96 L 416 392" stroke="#000" stroke-width="104" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <g fill="#000000">
      <path d="M 256 205 a 95 95 0 0 1 95 95 l -190 0 a 95 95 0 0 1 95 -95 z"/>
      <rect x="92" y="286" width="328" height="34" rx="17"/>
    </g>
    <circle cx="256" cy="256" r="212" fill="none" stroke="#000000" stroke-width="40"/>
  </g>
  <path d="M 132 108 L 404 380" stroke="#000000" stroke-width="42" stroke-linecap="round"/>
</svg>
